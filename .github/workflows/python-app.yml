# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Automated tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - name: Set up Python 3.10
      uses: actions/setup-python@v7
      with:
        python-version: "3.10"

    - name: Install Qt runtime libraries
      # PyQt6 wheels bundle Qt itself but still link against these, even for the
      # offscreen platform the GUI tests use.
      run: |
        sudo apt-get update
        sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install --upgrade setuptools
        # Install packages along with both runtime and development dependencies
        pip install -e ".[dev]"

    - name: Lint with ruff
      run: |
        ruff check --output-format=github .

    - name: Test with pytest
      env:
        QT_QPA_PLATFORM: offscreen
      run: |
        pytest tests/

