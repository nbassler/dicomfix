name: CI

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install Qt runtime libraries
      # PyQt6 wheels bundle Qt itself but still link against these, even for the
      # offscreen platform the GUI tests use. Without them importing PyQt6 fails.
      run: |
        sudo apt-get update
        sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"

    - name: Run tests
      env:
        QT_QPA_PLATFORM: offscreen
      run: |
        pytest --maxfail=2 --disable-warnings

  build-windows:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # needed for setuptools-scm versioning

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install pyinstaller
        python -m pip install .

    - name: Build EXE
      run: |
        pyinstaller --onefile --name dicomfix dicomfix/main.py

  build-linux:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # needed for setuptools-scm versioning

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install pyinstaller
        python -m pip install .

    - name: Build binary
      run: |
        pyinstaller --onefile --name dicomfix dicomfix/main.py
