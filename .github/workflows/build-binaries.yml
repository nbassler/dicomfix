name: Build Binaries

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
      with:
        fetch-depth: 0  # needed for setuptools-scm versioning

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install pyinstaller
        python -m pip install ".[gui]"

    # --onedir, not --onefile: the onefile bootloader unpacks itself into %TEMP% and
    # executes from there, which is what a dropper does, and Windows Defender flags the
    # result as a trojan. See #52. The cost is that the build is now a directory, so it
    # has to be zipped before it can go on a release.
    - name: Build CLI EXE
      run: |
        pyinstaller --onedir --name dicomfix dicomfix/main.py

    - name: Build GUI EXE
      # --add-data uses ';' as its separator on Windows and ':' on Linux. Getting it
      # wrong builds successfully but ships without main_window.ui, so the GUI starts
      # and then fails to find its layout.
      run: |
        pyinstaller --onedir --windowed --name dicomfix-gui `
          --icon dicomfix/gui/dicomfix.ico `
          --add-data "dicomfix/gui/main_window.ui;dicomfix/gui" `
          --add-data "dicomfix/gui/dicomfix.ico;dicomfix/gui" `
          dicomfix/gui/main.py

    - name: Check the GUI binary starts and found its layout
      run: |
        ./dist/dicomfix-gui/dicomfix-gui.exe --version

    - name: Archive Windows binaries
      # The folder itself goes in, not its contents, so unpacking gives one tidy
      # directory rather than loose DLLs in whatever the user extracted into.
      run: |
        Compress-Archive -Path dist/dicomfix -DestinationPath dist/dicomfix-windows-x86_64.zip
        Compress-Archive -Path dist/dicomfix-gui -DestinationPath dist/dicomfix-gui-windows-x86_64.zip

    - name: Upload EXEs to release
      if: github.event_name == 'release'
      uses: softprops/action-gh-release@v3
      with:
        files: |
          dist/dicomfix-windows-x86_64.zip
          dist/dicomfix-gui-windows-x86_64.zip

  build-linux:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
      with:
        fetch-depth: 0  # needed for setuptools-scm versioning

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.11'

    - name: Install Qt runtime libraries
      # PyInstaller bundles Qt itself but not these system libraries, so both the build
      # and the smoke test below need them. Linux users of the GUI binary need them too.
      run: |
        sudo apt-get update
        sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0

    - name: Install dependencies
      run: |
        python -m pip install pyinstaller
        python -m pip install ".[gui]"

    # --onedir here too, to keep both platforms building the same shape. The tar step
    # below already archives whatever 'dicomfix' is, so a directory needs no change there.
    - name: Build CLI binary
      run: |
        pyinstaller --onedir --name dicomfix dicomfix/main.py

    - name: Build GUI binary
      # ':' separator here, ';' on Windows. See the note in the Windows job.
      run: |
        pyinstaller --onedir --windowed --name dicomfix-gui \
          --add-data "dicomfix/gui/main_window.ui:dicomfix/gui" \
          --add-data "dicomfix/gui/dicomfix.ico:dicomfix/gui" \
          dicomfix/gui/main.py

    - name: Check the GUI binary starts and found its layout
      run: |
        QT_QPA_PLATFORM=offscreen ./dist/dicomfix-gui/dicomfix-gui --version

    - name: Archive Linux binaries
      run: |
        tar -C dist -czf dist/dicomfix-linux-x86_64.tar.gz dicomfix
        tar -C dist -czf dist/dicomfix-gui-linux-x86_64.tar.gz dicomfix-gui

    - name: Upload binaries to release
      if: github.event_name == 'release'
      uses: softprops/action-gh-release@v3
      with:
        files: |
          dist/dicomfix-linux-x86_64.tar.gz
          dist/dicomfix-gui-linux-x86_64.tar.gz
