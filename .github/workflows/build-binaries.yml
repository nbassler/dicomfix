name: Build Binaries

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # needed for setuptools-scm versioning

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install pyinstaller
        python -m pip install .

    - name: Build EXE
      run: |
        pyinstaller --onefile --name dicomfix dicomfix/main.py

    - name: Upload EXE to release
      if: github.event_name == 'release'
      uses: softprops/action-gh-release@v2
      with:
        files: dist/dicomfix.exe

  build-linux:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # needed for setuptools-scm versioning

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install pyinstaller
        python -m pip install .

    - name: Build binary
      run: |
        pyinstaller --onefile --name dicomfix dicomfix/main.py

    - name: Archive Linux binary
      run: |
        tar -C dist -czf dist/dicomfix-linux-x86_64.tar.gz dicomfix

    - name: Upload binary to release
      if: github.event_name == 'release'
      uses: softprops/action-gh-release@v2
      with:
        files: dist/dicomfix-linux-x86_64.tar.gz
