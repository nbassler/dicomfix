[build-system]
requires = ["setuptools>=42", "wheel", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[project]
name = "dicomfix"
# version = "0.1.0"  # Version is managed by setuptools_scm
description = "Modify and inspect DICOM proton therapy treatment plans."
authors = [
    { name = "Niels Bassler", email = "nbassler@users.noreply.github.com" },
]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "pydicom>=2.3.1",
    "pylibjpeg",          # JPEG decoding support for DICOM files
    "pylibjpeg-libjpeg",  # Support for JPEG compression
    "pylibjpeg-openjpeg", # Support for JPEG 2000 compression
    "pillow",             # Support for other image formats
]
dynamic = ["version"]

# New metadata
keywords = ["dicom", "radiotherapy", "proton", "rtplan", "medical-physics"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Healthcare Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]

[project.urls]
Homepage = "https://github.com/nbassler/dicomfix"
Repository = "https://github.com/nbassler/dicomfix"
Issues = "https://github.com/nbassler/dicomfix/issues"
Documentation = "https://nbassler.github.io/dicomfix"  # for docs later

[project.scripts]
dicomfix = "dicomfix.main:main"

[tool.setuptools.packages.find]
include = ["dicomfix*"]

[tool.setuptools.package-data]
"dicomfix.gui" = ["*.ui"]

[project.optional-dependencies]
gui = ["pyqt6>=6.5"]
web = ["streamlit>=1.12.0"]
test = ["pytest>=7.2.1"]
lint = ["ruff>=0.6"]
# gui is deliberately left out until the Qt frontend is finished (issue #41)
dev = ["dicomfix[web,test,lint]"]

[tool.pytest.ini_options]
log_cli = true
log_cli_level = "INFO"
log_cli_format = "%(message)s"

log_file = "pytest.log"
log_file_level = "DEBUG"
log_file_format = "%(asctime)s [%(levelname)8s] %(message)s (%(filename)s:%(lineno)s)"
log_file_date_format = "%Y-%m-%d %H:%M:%S"

[tool.ruff]
line-length = 127
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
# C90 (mccabe) is intentionally not enabled: under flake8 it only ever ran with
# --exit-zero, and 13 functions currently exceed max-complexity=6.

[tool.yapf]
based_on_style = "pep8"
column_limit = 127

[tool.setuptools_scm]
version_scheme = "post-release"
local_scheme = "node-and-date"
write_to = "dicomfix/__version__.py"
